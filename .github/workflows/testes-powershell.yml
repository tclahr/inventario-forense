name: Testes PowerShell

on:
  push:
    branches: [main]
    paths:
      - 'InventarioForense.ps1'
      - 'tests/ps1/**'
      - '.github/workflows/testes-powershell.yml'
  pull_request:
    branches: [main]
    paths:
      - 'InventarioForense.ps1'
      - 'tests/ps1/**'
      - '.github/workflows/testes-powershell.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester-windows:
    name: Pester (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Executar testes
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/ps1'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Normal'
          Invoke-Pester -Configuration $cfg
